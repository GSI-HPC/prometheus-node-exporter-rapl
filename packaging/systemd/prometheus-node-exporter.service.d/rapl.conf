#
# Installed by prometheus-node-exporter-rapl. Adds the "rapl" group, which
# holds read access to every powercap zone's energy_uj, to the exporter's
# process. SupplementaryGroups= is additive and independent of the unit's
# User=, so this works with whatever the exporter package sets, including
# DynamicUser=yes. Do not edit this file (package upgrades replace it); use
# `systemctl edit prometheus-node-exporter.service` for local overrides.

[Service]
SupplementaryGroups=rapl
